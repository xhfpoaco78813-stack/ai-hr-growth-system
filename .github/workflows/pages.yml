name: Verify formal HR service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hr-service-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify formal HR service
        run: |
          status=$(curl --retry 3 --retry-delay 3 --silent --output /tmp/hr-response.json --write-out "%{http_code}" "https://esg-api-six.vercel.app/api/hr?path=session")
          test "$status" = "401"
          grep -q '"error"' /tmp/hr-response.json
