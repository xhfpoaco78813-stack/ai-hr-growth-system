name: Deploy static HR sites to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Vercel aliases
        run: |
          for url in             "https://esg-api-six.vercel.app/api/hr?path=session"             "https://esg-api-git-master-xhfpoaco78813-stacks-projects.vercel.app/api/hr?path=session"             "https://esg-api-git-main-xhfpoaco78813-stacks-projects.vercel.app/api/hr?path=session"; do
            echo "=== $url"
            curl --max-time 15 --silent --show-error --dump-header - --output /tmp/body.txt --write-out "EFFECTIVE=%{url_effective} STATUS=%{http_code}\n" "$url" || true
            head -c 200 /tmp/body.txt || true
            echo
          done
          exit 1
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
