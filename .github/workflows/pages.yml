name: Deploy static HR sites to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover and verify formal HR service
        run: |
          urls=(
            "https://esg-api-six.vercel.app/api/hr?path=session"
            "https://esg-api-xhfpoaco78813-stacks-projects.vercel.app/api/hr?path=session"
            "https://esg-api-git-main-xhfpoaco78813-stacks-projects.vercel.app/api/hr?path=session"
            "https://esg-api-xhfpoaco78813-stack.vercel.app/api/hr?path=session"
          )
          for url in "${urls[@]}"; do
            status=$(curl --max-time 15 --silent --location --output /tmp/hr-response.txt --write-out "%{http_code}" "$url" || true)
            echo "CHECK=$url HTTP_STATUS=$status"
            head -c 300 /tmp/hr-response.txt || true
            echo
          done
          echo "VERCEL_API"
          curl --max-time 15 --silent --location "https://api.vercel.com/v13/deployments/1cPFeovAKwAbhdPqtETGvpXxVACG" | head -c 1000 || true
          echo
          echo "VERCEL_DASHBOARD_URLS"
          curl --max-time 15 --silent --location "https://vercel.com/xhfpoaco78813-stacks-projects/esg-api/1cPFeovAKwAbhdPqtETGvpXxVACG" | grep -oE 'https://[^" ]+vercel\.app' | head -20 || true
          exit 1
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
