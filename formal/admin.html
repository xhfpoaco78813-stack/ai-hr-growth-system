<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国人力资源职能系统 · 后台管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17213a;font:16px/1.6 system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer}.card{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:24px;margin-bottom:18px}.btn{border:0;background:#edf0fa;color:#273361;border-radius:9px;padding:9px 15px;margin:3px}.primary{background:#3848ad;color:white}input,select,textarea{border:1px solid #cbd2df;border-radius:8px;padding:10px;width:100%;margin:6px 0 14px}label{display:block}#onlineGate{position:fixed;inset:0;z-index:100;min-height:100vh;display:grid;background:#f7f4e9;color:#171b2d}#onlineGate>.card{width:min(460px,calc(100% - 36px));margin:auto}#onlineGate label{font-size:13px;font-weight:800;color:#283047}#onlineGate input{margin:7px 0 17px;padding:14px 15px;border:1px solid #d9deea;border-radius:11px;background:#fbfcfe;outline:none}#onlineGate input:focus{border-color:#e0a51d;box-shadow:0 0 0 4px rgba(243,189,61,.18)}.login-shell{min-height:100vh;display:grid;grid-template-columns:58% 42%;background:linear-gradient(133deg,#171b31 0%,#171b31 49.85%,#f7f4e9 50.05%,#f7f4e9 100%)}.login-story{display:flex;align-items:center;padding:8vh 6.4vw;color:#fff}.login-story-inner{width:min(650px,100%);transform:translateY(-1vh)}.login-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd86b,#e3a41d);color:#202438;font-size:20px;font-weight:950;box-shadow:0 14px 34px rgba(0,0,0,.2)}.login-kicker{margin-top:28px;color:#f2c85d;font-size:12px;font-weight:900;letter-spacing:.23em}.login-story h1{margin:16px 0 18px;font-size:clamp(38px,4.3vw,68px);line-height:1.08;letter-spacing:-.04em}.login-story p{max-width:610px;margin:0;color:#d8dbea;font-size:17px;line-height:1.8}.login-points{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.login-points span{border:1px solid rgba(255,216,107,.38);background:rgba(255,216,107,.06);color:#ffe291;border-radius:99px;padding:7px 13px;font-si
