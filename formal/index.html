<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0b6b57">
  <title>中国人力资源职能系统 V3.0</title>
  <style>
    :root{

    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
    button,input,select{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(246,243,234,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(24,52,46,.1)}
    .topin{max-width:1440px;margin:auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:12px;min-width:275px}
    .mark{width:42px;height:42px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 22px rgba(11,107,87,.25)}
    .brand b{display:block;font-size:15px}.brand small{color:var(--muted)}.nav{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px;white-space:nowrap;cursor:pointer;font-weight:700}
    .nav button:hover,.nav button.active{background:var(--mint);color:var(--green)}.save{margin-left:auto;color:var(--green);font-size:12px;font-weight:800;white-space:nowrap}
    main{max-width:1440px;margin:auto;padding:28px 24px 70px}.page{display:none}.page.active{display:block;animation:rise .25s ease}@keyframes rise{from{opacity:0;transform:translateY(6px)}}
    .eyebrow{color:var(--green);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:22px}
    .hero-main{border-radius:28px;padding:34px;background:linear-gradient(130deg,#0a604f,#0d8067);color:white;position:relative;overflow:hidden;min-height:255px;box-shadow:var(--shadow)}
    .hero-main:after{content:"";position:absolute;width:320px;height:320px;border:54px solid rgba(255,255,255,.07);border-radius:50%;right:-100px;top:-110px}
    .hero h1{font-size:clamp(28px,4vw,52px);line-height:1.05;margin:12px 0 14px;max-width:770px}.hero p{color:rgba(255,255,255,.8);max-width:690px;line-height:1.7}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);color:white}.hero .btn.primary{background:white;color:var(--green)}.btn.soft{background:var(--mint);color:var(--green)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fae8e7;color:var(--red)}
    .hero-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 25px rgba(24,52,46,.05)}
    .metric .num{font-size:34px;font-weight:900;color:var(--green);margin:8px 0 2px}.metric span{font-size:12px;color:var(--muted)}.metric.wide{grid-column:span 2;background:#fff8e9}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-head h2{margin:0;font-size:23px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 6px 24px rgba(24,52,46,.045)}.card.click{cursor:pointer;transition:.2s}.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#b5cec4}
    .icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--mint)}.card h3{margin:13px 0 7px;font-size:17px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
    .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.progress{height:8px;border-radius:99px;background:#e5ebe7;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#36b28f);border-radius:inherit}
    .tag{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;background:#edf2ef;color:var(--muted);font-size:11px;font-weight:800}.tag.D{background:#e2f0fb;color:#276899}.tag.S{background:#eee9fa;color:#604ba5}.tag.C{background:#fff0d6;color:#9a671b}.tag.O{background:#dff2e8;color:#08735a}.tag.L4{background:#f9e5e3;color:#a63c38}
    .module-foot{margin-top:14px}.module-foot .row{font-size:12px;color:var(--muted);margin-bottom:7px}.callout{background:#fff8e9;border:1px solid #ecd9ac;border-radius:16px;padding:16px;color:#795718;line-height:1.6;font-size:13px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.control{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);min-width:140px}.search{flex:1;min-width:220px}
    .path-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.sidepanel{position:sticky;top:94px;align-self:start}.step{padding:14px;border-left:3px solid #dbe4df;margin-left:8px;cursor:pointer}.step.done{border-color:var(--green)}.step.active{background:var(--mint);border-radius:0 12px 12px 0}.step b{display:block}.step small{color:var(--muted)}
    .chapter{margin-bottom:14px}.chapter-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer}.atom-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}

    .quiz-shell{display:grid;grid-template-columns:1fr 300px;gap:18px}.quiz-card{min-height:480px}.qtop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.qtext{font-size:21px;line-height:1.55;margin:25px 0}.options{display:grid;gap:10px}.option{border:1.5px solid var(--line);background:white;border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--ink);display:flex;gap:11px;align-items:flex-start}.option:hover{border-color:#8ab8a8}.option.selected{border-color:var(--green);background:#eff9f5}.option.correct{border-color:var(--green2);background:#e5f7ef}.option.wrong{border-color:var(--red);background:#fbeceb}.letter{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#edf1ef;display:grid;place-items:center;font-weight:900}
    .explain{margin-top:16px;padding:16px;border-radius:14px;background:#f1f6f3;line-height:1.7;font-size:13px;display:none}.explain.show{display:block}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
    .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.dot{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:white;font-size:11px;cursor:pointer}.dot.answered{background:var(--mint);color:var(--green)}.dot.current{outline:2px solid var(--green)}
    .diagnosis{display:grid;grid-template-columns:1fr 1fr;gap:16px}.barrow{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.bar{height:10px;background:#e7ece9;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;border-radius:99px;background:var(--green)}
    .source-table{width:100%;border-collapse:collapse;font-size:13px}.source-table th,.source-table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);vertical-align:top}.source-table th{color:var(--muted);font-size:11px;letter-spacing:.06em}
    .empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty .big{font-size:46px}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:white;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:none}
    .modal{position:fixed;inset:0;background:rgba(16,34,30,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal.show{display:flex}.modalbox{background:var(--card);width:min(680px,100%);max-height:86vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:var(--shadow)}
    .result-score{font-size:64px;font-weight:900;color:var(--green)}.hide{display:none!important}.small{font-size:12px;color:var(--muted)}.warn{color:var(--amber)}.good{color:var(--green)}.bad{color:var(--red)}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.path-layout,.quiz-shell{grid-template-columns:1fr}.sidepanel{position:static}.diagnosis{grid-template-columns:1fr}}
    @media(max-width:720px){.topin{height:auto;padding:12px 16px;flex-wrap:wrap}.brand{min-width:0;flex:1}.brand small,.save{display:none}.nav{order:3;width:100%}main{padding:20px 14px 55px}.hero-main{padding:25px;min-height:0}.hero h1{font-size:31px}.hero-side{grid-template-columns:1fr 1fr}.grid,.atom-list{grid-template-columns:1fr}.section-head{align-items:start}.toolbar .control{width:100%}.qtext{font-size:18px}.barrow{grid-template-columns:110px 1fr 36px}.source-table{display:block;overflow:auto}.metric .num{font-size:28px}}

    page.innerHTML='<div class="workspace-head"><div><h1>'+ps.paper.year+' · '+ps.paper.title+'</h1><p>第 '+(ps.index+1)+' / '+ps.list.length+' 题 · '+q.moduleName+'</p></div><button class="btn ghost" onclick="app.exitPast()">退出训练</button></div><div class="coach-layout"><div class="card quiz-card"><div class="qtop"><span class="tag '+q.difficulty+'">'+q.difficulty+' · '+esc(q.cognitive||"综合判断")+'</span><b>'+q.chapter+'</b></div><div class="qtext">'+esc(q.stem)+'</div>'+(!rev?'<button class="btn soft" onclick="app.pastHint()">'+(hint?'收起教练提示':'💡 请教练提示拆题方向')+'</button>':'')+(hint&&!rev?'<div class="coach-box" style="margin-top:12px"><h3>先别急着选答案</h3><div class="coach-step"><i>1</i><span>'+esc(c.focus)+'</span></div><div class="coach-step"><i>2</i><span>这题真正要辨认的是：<b>'+esc(c.concept)+'</b></span></div></div>':'')+'<div class="options" style="margin-top:16px">'+q.options.map(function(o,i){var cls=pick===i?' selected':'';if(rev){if(i===q.answer)cls=' correct';else if(pick===i)cls=' wrong'}return '<button class="option'+cls+'" onclick="app.pastPick('+i+')" '+(rev?'disabled':'')+'><span class="letter">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div>'+(rev?'<div class="explain show"><b>'+(pick===q.answer?'判断正确':'正确答案：'+"ABCD"[q.answer])+'</b><br>'+esc(q.explanation)+'<div class="concept-map"><div>核心观念<br>'+esc(c.concept)+'</div><div>常见陷阱<br>相邻概念偷换</div><div>迁移应用<br>检查条件与边界</div></div><p style="margin-bottom:0"><b>教练追问：</b>'+esc(c.transfer)+'</p></div>':'')+'<div class="quiz-actions"><button class="btn ghost" onclick="app.pastMove(-1)" '+(ps.index===0?'disabled':'')+'>上一题</button>'+(rev?'<button class="btn primary" onclick="app.pastMove(1)">'+(ps.index===ps.list.length-1?'完成训练':'下一题')+'</button>':'<button class="btn primary" onclick="app.pastSubmit()">提交答案</button>')+'</div></div><aside class="coach-box"><h3>🧠 智能考题教练</h3><p>本轮训练不是背选项，而是掌握三件事：</p><div class="coach-step"><i>1</i><span>辨识题目正在考哪一个HR概念</span></div><div class="coach-step"><i>2</i><span>找出选项中的偷换对象与遗漏条件</span></div><div class="coach-step"><i>3</i><span>把原则迁移到真实工作场景</span></div><div class="progress" style="margin-top:18px"><i style="width:'+pct(Object.keys(ps.revealed).length,ps.list.length)+'%;background:#d29b20"></i></div><p class="small">已完成 '+Object.keys(ps.revealed).length+' / '+ps.list.length+' 题</p></aside></div>'
  }
  function pastPick(i){var q=pastSession.list[pastSession.index];if(pastSession.revealed[q.id])return;pastSession.picks[q.id]=i;renderPastQuiz()}
  function pastSubmit(){var q=pastSession.list[pastSession.index],pick=pastSession.picks[q.id];if(pick===undefined){toast("请先选择一个答案");return}pastSession.revealed[q.id]=true;record(q,pick);renderPastQuiz()}
  function pastMove(d){if(d<0&&pastSession.index>0){pastSession.index--;renderPastQuiz();return}if(d>0&&pastSession.index<pastSession.list.length-1){pastSession.index++;renderPastQuiz();return}if(d>0)finishPast()}
  function finishPast(){
    var ps=pastSession,correct=ps.list.filter(function(q){return ps.picks[q.id]===q.answer}).length,score=pct(correct,ps.list.length),weak={};ps.list.forEach(function(q){if(ps.picks[q.id]!==q.answer)weak[q.moduleName]=(weak[q.moduleName]||0)+1});
    state.pastHistory=state.pastHistory||[];state.pastHistory.push({id:ps.paper.id,year:ps.paper.year,title:ps.paper.title,score:score,count:ps.list.length,date:new Date().toLocaleDateString("zh-CN")});state.pastHistory=state.pastHistory.slice(-50);save();ps.finished=true;
    document.getElementById("past").innerHTML='<div class="card lesson-result"><div class="eyebrow">历届专题训练完成</div><div class="result-score">'+score+'分</div><h2>'+(score>=85?'你已掌握本卷主要命题逻辑':score>=60?'基础观念已建立，建议回补易错模块':'先回看核心知识，再进行一次针对练习')+'</h2><p>答对 '+correct+' / '+ps.list.length+' 题</p><div class="coach-box" style="max-width:720px;margin:18px auto;text-align:left"><h3>教练复盘</h3><p>'+(Object.keys(weak).length?'优先回补：'+Object.keys(weak).sort(function(a,b){return weak[b]-weak[a]}).slice(0,3).join('、')+'。复习时请用“概念—条件—应用边界”重新整理。':'本卷没有明显弱项。下一步可选择其他年度专题，扩大考点覆盖。')+'</p></div><div class="row" style="justify-content:center"><button class="btn primary" onclick="app.restartPast()">再练一次</button><button class="btn ghost" onclick="app.exitPast()">返回历届考题</button><button class="btn soft" onclick="app.page(\'wrong\')">查看错题</button></div></div>'
  }
  function renderWrong(){
    var ids=Object.keys(state.wrong),list=ids.map(function(id){return questions.find(function(q){return q.id===id})}).filter(Boolean);
    document.getElementById("wrong").innerHTML='<div class="section-head"><div><h2>错题回补</h2><p>回看知识并重新练习答错的题目</p></div>'+(list.length?'<button class="btn primary" onclick="app.retryWrong()">开始错题训练</button>':"")+'</div>'+(list.length?'<div class="grid">'+list.slice(0,100).map(function(q){var a=atoms.find(function(x){return x.id===q.atomId});return '<div class="card"><div class="row between"><span class="tag '+q.difficulty+'">'+q.difficulty+'</span></div><h3 style="font-size:15px">'+a.name+'</h3><p>'+a.rule+'</p><div class="row between" style="margin-top:14px"><span class="small">'+q.moduleName+'</span><button class="btn soft" onclick="app.learnAtom(\''+a.id+'\')">回看知识</button></div></div>'}).join("")+'</div>':'<div class="card empty"><div class="big">✓</div><h2>当前没有错题</h2><p>完成刷题或模拟考后，错题会自动收录在这里。</p><button class="btn primary" onclick="app.page(\'practice\')">去刷题</button></div>')
  }
  function getWeak(){
    return modules.map(function(m){var s=moduleStats(m.id);return {id:m.id,name:m.name,answered:s.answered,accuracy:s.answered?s.accuracy:0,learn:s.learn}}).sort(function(a,b){var ax=a.answered?0:1,bx=b.answered?0:1;return ax-bx||a.accuracy-b.accuracy||a.learn-b.learn})
  }
  function renderDiagnosis(){
    var weak=getWeak(),total=Object.keys(state.answers).length;
    document.getElementById("diagnosis").innerHTML='<div class="section-head"><div><h2>能力诊断</h2><p>查看能力表现与下一步学习建议</p></div></div><div class="diagnosis"><div class="card"><h3>十项能力表现</h3>'+weak.map(function(x){var score=x.answered?Math.round(x.accuracy*.75+x.learn*.25):x.learn;return '<div class="barrow"><span>'+x.name+'</span><div class="bar"><i style="width:'+score+'%;background:'+(score<60?"#c9504b":score<80?"#e49b2f":"#0b6b57")+'"></i></div><b>'+score+'</b></div>'}).join("")+'</div><div><div class="card" style="margin-bottom:16px"><h3>下一步建议</h3>'+(total>=10?weak.slice(0,3).map(function(x,i){return '<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="icon" style="width:34px;height:34px;font-size:14px">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="small">正确率 '+x.accuracy+'% · 学习 '+x.learn+'%</div></div><button class="btn soft" style="margin-left:auto" onclick="app.openModule(\''+x.id+'\')">回补</button></div>'}).join(""):'<div class="empty"><p>至少完成10道题，系统才能形成有效诊断。</p><button class="btn primary" onclick="app.quick()">开始基线测验</button></div>')+'</div><div class="card"><h3>数据充分度</h3><div class="result-score" style="font-size:40px">'+Math.min(100,total,Math.round(weak.filter(function(x){return x.answered>=10}).length/5*100))+'%</div><p>已答 '+total+' 题。累计完成100题并覆盖至少5个模块后，分析会更加稳定。</p></div></div></div>'
  }
  function renderSources(){
    document.getElementById("sources").innerHTML='<div class="section-head"><div><h2>官方资料池</h2><p>查看系统学习内容所依据的官方文件</p></div></div><div class="card"><table class="source-table"><thead><tr><th>官方文件</th><th>发布单位／年份</th><th>覆盖内容</th><th>状态</th></tr></thead><tbody>'+sources.map(function(s){return '<tr><td><a href="'+s.url+'" target="_blank" rel="noopener" style="color:var(--green);font-weight:800">'+s.name+'</a></td><td>'+s.org+'<br><span class="small">'+s.year+'</span></td><td>'+s.scope+'</td><td>'+s.status+'</td></tr>'}).join("")+'</tbody></table></div><div class="callout" style="margin-top:16px"><b>使用提醒：</b> 法规、缴费基数、税率、最低工资和考试大纲可能调整，实际应用时请核对所在地最新规定。</div>'
  }
  function feedbackLabel(status){return status==="resolved"?"已处理":status==="reviewing"?"处理中":"已收到"}
  function feedbackType(type){return {suggestion:"功能建议",content:"内容建议",experience:"使用体验",problem:"问题回报",other:"其他"}[type]||"其他"}
  async function renderFeedback(){
    var page=document.getElementById("feedback");page.innerHTML='<div class="workspace-head"><div><h1>意见反馈</h1><p>告诉我们哪里可以做得更好</p></div><div class="status-pill">由管理团队阅览</div></div><div class="feedback-layout"><form class="card feedback-form" id="feedbackForm"><h2>提出建议</h2><p>你的账号会随反馈一并记录，方便管理团队辨识问题。</p><label>反馈类型<select name="category" required><option value="suggestion">功能建议</option><option value="content">内容建议</option><option value="experience">使用体验</option><option value="problem">问题回报</option><option value="other">其他</option></select></label><label>主题<input name="subject" maxlength="80" placeholder="请简要说明重点" required></label><label>详细内容<textarea name="message" maxlength="2000" placeholder="请说明发生位置、你的建议或希望改善的方式" oninput="document.getElementById(\'feedbackCount\').textContent=this.value.length+\' / 2000\'" required></textarea></label><div class="row between"><span class="small">请勿填写身份证、银行卡等敏感资料</span><span class="small" id="feedbackCount">0 / 2000</span></div><button class="btn primary" style="margin-top:16px" type="submit">提交反馈</button><p id="feedbackNotice" role="status"></p></form><div><div class="section-head" style="margin-top:0"><div><h2>我的反馈</h2><p>最近30笔提交记录</p></div></div><div id="feedbackList"><div class="card">正在载入…</div></div></div></div>';document.getElementById("feedbackForm").onsubmit=submitFeedback;
    try{var r=await api("feedback"),list=r.feedbacks,box=document.getElementById("feedbackList");if(!box)return;box.innerHTML=list.length?list.map(function(x){return '<article class="card feedback-item '+x.status+'"><div class="feedback-meta"><span class="tag">'+feedbackType(x.category)+'</span><b>'+feedbackLabel(x.status)+'</b></div><h3>'+esc(x.subject)+'</h3><p class="feedback-message">'+esc(x.message)+'</p>'+(x.publicReply?'<div class="reply-box"><b>管理团队回复</b><br>'+esc(x.publicReply)+'<div class="small">'+(x.repliedAt?new Date(x.repliedAt).toLocaleString("zh-CN"):"")+'</div></div>':'')+'<div class="small" style="margin-top:12px">'+new Date(x.createdAt).toLocaleString("zh-CN")+'</div></article>'}).join(""):'<div class="card feedback-empty"><div class="big">💬</div><h3>尚未提交反馈</h3><p>你的建议会成为下一轮优化的重要参考。</p></div>'}catch(e){var box=document.getElementById("feedbackList");if(box)box.innerHTML='<div class="card bad">载入失败：'+esc(e.message)+'</div>'}
  }
  async function submitFeedback(e){e.preventDefault();var form=e.currentTarget,button=form.querySelector("button[type=submit]"),notice=document.getElementById("feedbackNotice"),data=new FormData(form);button.disabled=true;notice.textContent="正在提交…";try{await api("feedback","POST",{category:data.get("category"),subject:data.get("subject"),message:data.get("message")});toast("反馈已提交，谢谢你的建议");renderFeedback()}catch(err){notice.textContent=err.message;button.disabled=false}}
  window.app={
    page:setPage,goPath:function(){if(state.lessonDraft)resumeLesson();else{lesson=null;setPage("path");renderPath(goalInfo().modules[0])}},resumeLesson:resumeLesson,openModule:function(id){lesson=null;setPage("path");renderPath(id)},
    startBaseline:function(){setPage("exam");startQuiz("exam",{count:20,purpose:"baseline"})},startFinal:function(){setPage("exam");startQuiz("exam",{count:20,purpose:"final"})},resetGoal:function(){learnerProfile=null;renderHome()},
    learnAtom:function(id){var a=atoms.find(function(x){return x.id===id});if(a)startLesson(a.module,a.chapter,[a],false)},
    startLesson:startLesson,startReview:startReview,startChapter:function(m,i){startLesson(m,moduleBy(m).chapters[Number(i)][0])},confirmFinish:function(){if(!quiz)return;quiz.confirmed=true;window.app.closeModal();finishQuiz()},
    revealLesson:function(){var a=lesson.atoms[lesson.index];lesson.seen[a.id]=true;renderLesson()},
    lessonMove:function(d){
      if(!lesson||lesson.stage!=="study")return;
      var a=lesson.atoms[lesson.index];if(d>0&&!lesson.seen[a.id]){toast("请先查看核心原则");return}
      if(d>0&&lesson.index===lesson.atoms.length-1){lesson.stage="quiz";lesson.qIndex=0;renderLesson();return}
      lesson.index=Math.max(0,Math.min(lesson.atoms.length-1,lesson.index+d));renderLesson()
    },
    lessonPick:function(i){var a=lesson.atoms[lesson.qIndex];if(lesson.selections[a.id]!==undefined)return;var q=lessonQuestion(a,lesson.qIndex);lesson.selections[a.id]=i;lesson.results[a.id]=i===q.answer;lesson.pendingRecords.push(record(q,i));renderLesson()},
    lessonNext:function(){var a=lesson.atoms[lesson.qIndex];if(lesson.selections[a.id]===undefined){toast("请先选择答案");return}if(lesson.qIndex===lesson.atoms.length-1)return finishLesson();else{lesson.qIndex++;renderLesson()}},
    retryLesson:function(){var missed=lesson.atoms.filter(function(a){return !lesson.results[a.id]});if(missed.length)startLesson(missed[0].module,missed[0].chapter,missed,false)},
    exitLesson:function(){var id=lesson&&lesson.moduleId||modules[state.pathIndex].id;lesson=null;renderPath(id)},
    start:startQuiz,resumeExam:resumeExam,quick:function(){setPage("practice");startQuiz("practice",{count:10})},practiceChapter:function(m,ch){setPage("practice");startQuiz("practice",{module:m,chapter:ch,count:10})},
    startPast:startPast,pastPick:pastPick,pastSubmit:pastSubmit,pastMove:pastMove,pastHint:function(){var q=pastSession.list[pastSession.index];pastSession.hints[q.id]=!pastSession.hints[q.id];renderPastQuiz()},exitPast:function(){pastSession=null;renderPast()},restartPast:function(){var id=pastSession.paper.id;startPast(id)},
    pick:pick,reveal:reveal,next:next,prev:function(){if(quiz.index>0){quiz.index--;renderQuiz()}},jump:function(i){quiz.index=i;renderQuiz()},
    finish:finishQuiz,bookmark:function(id){state.bookmarks[id]=!state.bookmarks[id];save();renderQuiz();toast(state.bookmarks[id]?"已收藏":"已取消收藏")},
    retryWrong:function(){var ids=Object.keys(state.wrong);setPage("practice");startQuiz("practice",{ids:ids,count:Math.min(50,ids.length)})},
    closeModal:closeModal,closeResult:function(){closeModal();setPage("diagnosis")}
  };
  document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")window.app.closeModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
  document.addEventListener("keydown",function(e){if(!quiz||quiz.finished||document.getElementById("modal").classList.contains("show")||/INPUT|SELECT|TEXTAREA|BUTTON|A/.test((e.target&&e.target.tagName)||""))return;if(/^[1-4]$/.test(e.key)){e.preventDefault();pick(Number(e.key)-1)}else if(e.key==="ArrowLeft"){e.preventDefault();window.app.prev()}else if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();next()}});
  window.hrBridge={
    load:function(data,progress,unfinishedExam,profile){
      stopTimer();quiz=null;lesson=null;pendingExam=unfinishedExam||null;learnerProfile=profile||null;modules=data.modules;sources=data.sources;stems=data.stems;overrides=data.overrides||{};
      state=Object.assign({doneAtoms:{},answers:{},wrong:{},bookmarks:{},history:[],pastHistory:[],pathIndex:0,streak:0,lastDate:"",mastery:{},lessonHistory:[]},progress||{});
      if(!Array.isArray(state.pastHistory))state.pastHistory=[];
      if(!state.mastery)state.mastery={};if(!state.lessonHistory)state.lessonHistory=[];
      if(state.lessonDraft&&!state.lessonDraft.sessionId)state.lessonDraft.sessionId="LS-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
      atoms=allAtoms();questions=bank();
      Object.keys(state.doneAtoms).forEach(function(id){if(!state.mastery[id])state.mastery[id]={level:1,nextReview:Date.now()+86400000,correct:1,attempts:1}});
      document.title=(data.title||"中国人力资源职能系统")+" · 学习系统";
      var brand=document.querySelector(".side-brand b");if(brand)brand.textContent=data.title||"中国人力资源职能系统"
    },
    home:function(){setPage("home")},profile:function(p){learnerProfile=p;renderHome()},
    stop:function(){stopTimer();quiz=null;lesson=null}
  };

})();
</script>
